server:
  port: 8080
spring:
  application:
    name: franchises
  devtools:
    add-properties: false
  r2dbc:
    url: ${R2DBC_URL}
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}

  cors:
    allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
